<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milu Nutrition & Balance</title>
    <style>
        body { font-family: 'Arial', sans-serif; margin: 0; background-color: #fafafa; color: #333; }
        .container { max-width: 480px; margin: 0 auto; background: #ffffff; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Portada */
        .portada { width: 100%; height: auto; display: block; }
        
        /* Leyenda */
        .leyenda { padding: 25px 20px; text-align: center; background: #fff; }
        .leyenda h2 { color: #003990; margin: 0 0 10px 0; font-size: 24px; }
        .leyenda p { font-size: 16px; line-height: 1.5; color: #555; margin: 0; }

        /* Botones Interactivos */
        .grid-botones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .btn-kit { border: none; border-radius: 12px; padding: 15px 5px; color: white; font-size: 14px; font-weight: bold; cursor: pointer; }
        .btn-green { background-color: #70b324; }
        .btn-glow { background-color: #d63384; }
        .btn-tropical { background-color: #f0a530; }
        .btn-reset { background-color: #a3d9c9; color: #222; }
        .btn-sweet { background-color: #2b3e50; }
        .btn-defensa { background-color: #fd7e14; }

        /* Info que se desprende */
        .info-desplegada { margin: 0 15px 20px 15px; padding: 20px; border-radius: 20px; text-align: center; display: none; }

        /* Imágenes de variedades (abajo) */
        .variedades { padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .variedades img { width: 100%; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.08); }

        /* Footer */
        footer { padding: 30px 15px; text-align: center; border-top: 1px solid #eee; background: #f9f9f9; font-size: 14px; }
        footer a { color: #003990; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. PORTADA -->
        <img src="IMG_7518.png" class="portada" alt="Hola Medellín Somos Milu">

        <!-- 2. LEYENDA -->
        <div class="leyenda">
            <h2>Somos Milu</h2>
            <p>Tu nuevo kit de frutas congeladas listo para licuar. Una propuesta natural, práctica y funcional diseñada para tu bienestar diario.</p>
        </div>

        <!-- 3. ÍTEMS INTERACTIVOS -->
        <div style="text-align:center; font-weight:bold; color:#003990;">Selecciona un sabor:</div>
        <div class="grid-botones">
            <button class="btn-kit btn-green" onclick="mostrarInfo('green')">Green Focus</button>
            <button class="btn-kit btn-glow" onclick="mostrarInfo('glow')">Glow & Skin</button>
            <button class="btn-kit btn-tropical" onclick="mostrarInfo('tropical')">Tropical Recovery</button>
            <button class="btn-kit btn-reset" onclick="mostrarInfo('reset')">Reset Digest</button>
            <button class="btn-kit btn-sweet" onclick="mostrarInfo('sweet')">Sweet Dreams</button>
            <button class="btn-kit btn-defensa" onclick="mostrarInfo('defensa')">Defensa Activa</button>
        </div>

        <div id="caja-info" class="info-desplegada">
            <h2 id="info-titulo" style="margin-top:0;"></h2>
            <p id="info-descripcion"></p>
        </div>

        <!-- 4. IMÁGENES DE VARIEDADES (ABAJO) -->
        <div class="variedades">
            <img src="IMG_7519.png" alt="Nuestros Kits">
            <img src="IMG_7520.png" alt="Variedades Milu">
        </div>

        <!-- 5. PIE DE PÁGINA PROFESIONAL -->
        <footer>
            <p><strong>Luisa Vanegas</strong></p>
            <p>Ingeniería de Alimentos | Universidad de Antioquia</p>
            <p>Medellín, Colombia</p>
            <p style="margin-top:10px;">
                Instagram: <a href="https://www.instagram.com/milu_nb11?igsh=MXgzOHAwdnByM29qNQ%3D%3D&utm_source=qr" target="_blank">@milu_nb11</a>
            </p>
        </footer>
    </div>

    <script>
        const kits = {
            green: { t: "🍏 Green Focus", d: "Energía y concentración mental. Manzana verde, espinaca, kiwi y limón.", c: "#70b324" },
            glow: { t: "🍓 Glow & Skin", d: "Favorece la regeneración celular y la salud de la piel. Fresa, mora y remolacha.", c: "#d63384" },
            tropical: { t: "🥭 Tropical Recovery", d: "Repón electrolitos de forma natural con mango, maracuyá y chía.", c: "#f0a530" },
            reset: { t: " Pineapple Reset", d: "Ayuda a la digestión y reduce la inflamación. Piña, apio y menta.", c: "#a3d9c9" },
            sweet: { t: "🍒 Sweet Dreams", d: "Promueve la relajación para un sueño reparador. Cereza, pera y canela.", c: "#2b3e50" },
            defensa: { t: "🛡️ Defensa Activa", d: "Fortalece tu sistema inmunológico con naranja, zanahoria y jengibre.", c: "#fd7e14" }
        };
        function mostrarInfo(k) {
            const info = kits[k];
            const caja = document.getElementById('caja-info');
            document.getElementById('info-titulo').innerHTML = info.t;
            document.getElementById('info-descripcion').innerHTML = info.d;
            caja.style.border = `3px solid ${info.c}`;
            caja.style.display = 'block';
            caja.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    </script>
</body>
</html>
