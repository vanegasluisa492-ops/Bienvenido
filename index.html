<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milu Nutrition</title>
    <style>
        body { font-family: 'Arial', sans-serif; margin: 0; padding: 0; background-color: #fff; }
        .main-container { max-width: 500px; margin: 0 auto; display: flex; flex-direction: column; }
        
        /* LA FOTO DEL CÍRCULO "HOLA MEDELLÍN" - POSICIÓN 1 */
        .foto-bienvenida { width: 100%; order: 1; }
        
        /* TEXTO DE INTRODUCCIÓN - POSICIÓN 2 */
        .intro-box { order: 2; padding: 20px; text-align: center; }
        .intro-box h2 { color: #003990; }

        /* BOTONES INTERACTIVOS - POSICIÓN 3 */
        .interactivo-box { order: 3; padding: 20px; background: #f9f9f9; }
        .grid-botones { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn { border: none; padding: 15px; color: #fff; font-weight: bold; border-radius: 5px; cursor: pointer; font-size: 11px; text-transform: uppercase; }
        
        /* Colores */
        .g { background: #70b324; } .gl { background: #d63384; }
        .t { background: #f0a530; } .r { background: #a3d9c9; color: #333; }
        .s { background: #2b3e50; } .d { background: #fd7e14; }

        #display-tecnico { margin-top: 15px; padding: 15px; border: 2px solid #003990; border-radius: 10px; display: none; background: white; }

        /* LA FOTO DE LOS 6 PAQUETES - POSICIÓN 4 (AL FINAL) */
        .portafolio-titulo { order: 4; background: #003990; color: #fff; text-align: center; padding: 10px; font-weight: bold; margin-top: 20px; }
        .foto-portafolio { width: 100%; order: 5; }

        footer { order: 6; text-align: center; padding: 30px; font-size: 13px; border-top: 1px solid #eee; }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- 1. ESTA ES LA FOTO QUE DEBE SALIR ARRIBA -->
        <img src="IMG_7518.png" class="foto-bienvenida" alt="Círculo Milu Medellín">

        <div class="intro-box">
            <h2>Ingeniería para tu Bienestar</h2>
            <p>Optimización nutricional mediante tecnología de conservación.</p>
        </div>

        <div class="interactivo-box">
            <p style="text-align: center; font-weight: bold; color: #003990;">ANÁLISIS TÉCNICO:</p>
            <div class="grid-botones">
                <button class="btn g" onclick="show('green')">Green Focus</button>
                <button class="btn gl" onclick="show('glow')">Glow & Skin</button>
                <button class="btn t" onclick="show('tropical')">Tropical Recovery</button>
                <button class="btn r" onclick="show('reset')">Reset Digest</button>
                <button class="btn s" onclick="show('sweet')">Sweet Dreams</button>
                <button class="btn d" onclick="show('defensa')">Defensa Activa</button>
            </div>

            <div id="display-tecnico">
                <h3 id="txt-t" style="margin-top:0;"></h3>
                <p id="txt-i"></p>
                <p id="txt-b"></p>
            </div>
        </div>

        <!-- 2. ESTA ES LA FOTO QUE DEBE SALIR ABAJO -->
        <div class="portafolio-titulo">PORTAFOLIO DE PRODUCTOS</div>
        <img src="IMG_7520.png" class="foto-portafolio" alt="6 Sabores Milu">

        <footer>
            <p><strong>Luisa Vanegas</strong><br>Estudiante de Ingeniería de Alimentos - UdeA</p>
        </div>
    </div>

    <script>
        const data = {
            green: { t: "🍏 Green Focus", i: "Manzana verde, espinaca, kiwi, limón", b: "Aporte de hierro y clorofila para energía mental." },
            glow: { t: "🍓 Glow & Skin", i: "Fresa, mora, arándano, remolacha", b: "Regeneración celular y salud de la piel." },
            tropical: { t: "🥭 Tropical Recovery", i: "Mango, maracuyá, chía", b: "Electrolitos y energía post-ejercicio." },
            reset: { t: "🍍 Reset Digest", i: "Piña, apio, pepino, menta", b: "Digestión y desinflamación." },
            sweet: { t: "🍒 Sweet Dreams", i: "Cereza, pera, canela", b: "Precursores de melatonina para descansar." },
            defensa: { t: "🛡️ Defensa Activa", i: "Naranja, zanahoria, jengibre, cúrcuma", b: "Vitamina C para el sistema inmune." }
        };

        function show(k) {
            const item = data[k];
            document.getElementById('display-tecnico').style.display = 'block';
            document.getElementById('txt-t').innerText = item.t;
            document.getElementById('txt-i').innerHTML = "<b>Ingredientes:</b> " + item.i;
            document.getElementById('txt-b').innerHTML = "<b>Beneficio:</b> " + item.b;
            document.getElementById('display-tecnico').scrollIntoView({behavior: "smooth"});
        }
    </script>
</body>
</html>
