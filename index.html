<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Milu Nutrition & Balance</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fafafa;
            color: #333333;
        }
        .container {
            max-width: 480px;
            margin: 0 auto;
            background: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .card-producto {
            border: 3px solid #ff8c00;
            border-radius: 24px;
            margin: 15px;
            padding: 20px;
            text-align: center;
        }
        .galeria-inicio {
            padding: 0 15px 20px 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .galeria-inicio img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.08);
        }
        footer {
            margin-top: auto;
            padding: 25px 15px;
            text-align: center;
            border-top: 1px solid #eeeeee;
            background-color: #f9f9f9;
        }
        footer a {
            color: #003990;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Sección de Producto Destacado -->
        <div class="card-producto">
            <h2 style="color: #111111; margin-top: 0;">🛡️ Defensa Activa</h2>
            <h3 style="color: #003990; margin-bottom: 5px;">La Ciencia en tu Vaso</h3>
            <p style="color: #555555; margin: 0;">Beta-carotenos y Vitamina C para tus barreras inmunológicas.</p>
        </div>

        <!-- Galería con tus nuevas fotos de MiLu -->
        <div class="galeria-inicio">
            <img src="IMG_7518.png" alt="Logo MiLu">
            <img src="IMG_7519.png" alt="Kits MiLu">
            <img src="IMG_7520.png" alt="Sabores MiLu">
        </div>

        <!-- Pie de página: Instagram en lugar de número de celular -->
        <footer>
            <p style="margin: 0 0 8px 0; font-weight: bold;">Milu Nutrition & Balance | Medellín</p>
            <p style="margin: 0;">
                Instagram: <a href="https://www.instagram.com/milu_nb11?igsh=MXgzOHAwdnByM29qNQ%3D%3D&utm_source=qr" target="_blank">@milu_nb11</a>
            </p>
        </footer>

    </div>

</body>
</html>
